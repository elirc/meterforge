services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: meterforge
      POSTGRES_USER: meterforge
      POSTGRES_PASSWORD: local-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meterforge"]
      interval: 5s
      timeout: 3s
      retries: 10
